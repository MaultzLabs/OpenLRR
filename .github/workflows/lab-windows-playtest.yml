name: Windows virtual game playtest laboratory
on:
  push:
    branches: [lab-windows-virtual-playtest-v1]
    paths:
      - lab/windows-playtest/**
      - .github/workflows/lab-windows-playtest.yml
  workflow_dispatch:
    inputs:
      run_private_game:
        description: "Run original game smoke test only on a preconfigured private interactive Windows runner"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-playtest-${{ github.ref }}-${{ github.event_name }}
  # Preserve one-off engine builds even when concurrent lab work commits.
  cancel-in-progress: false
jobs:
  scenario-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate scenarios and safeguards
        run: python3 -m unittest discover -s lab/windows-playtest/tests -v

  synthetic-windows-gui:
    needs: scenario-validation
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install capture dependency
        run: python -m pip install "Pillow>=11.2,<12"
      - name: Exercise real Win32 input and window-only capture on synthetic test app
        shell: pwsh
        run: |
          $fixture = (Resolve-Path 'lab/windows-playtest/tests/fixture.ps1').Path
          $argFile = '"' + $fixture + '"'
          $fixtureProc = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-STA', '-ExecutionPolicy', 'Bypass', '-File', $argFile) -PassThru
          Start-Sleep -Seconds 2
          Write-Host "Fixture PID: $($fixtureProc.Id); exited: $($fixtureProc.HasExited)"
          if ($fixtureProc.HasExited) { throw "Fixture process exited before UI was observed; check quoting/Windows-session constraints." }
          try {
            python lab/windows-playtest/playtest.py --pid $fixtureProc.Id --scenario lab/windows-playtest/tests/fixture-scenario.json --title 'OpenLRR Fixture' --out lab/windows-playtest/out/fixture
            if ($LASTEXITCODE -ne 0) { throw "Windows GUI fixture failed. Inspect report rather than assuming desktop access." }
            # Verify the spectator HTTP viewer captures the SAME synthetic HWND,
            # before we attempt to expose any real retail game through a tunnel.
            $spectatorProc = Start-Process python -ArgumentList @('lab/windows-playtest/spectator.py','--pid',"$($fixtureProc.Id)",'--title','OpenLRR','--port','8765') -PassThru
            $viewerFrame = Join-Path $env:RUNNER_TEMP 'openlrr-spectator-test.jpg'
            $viewerReady = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Milliseconds 300
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:8765/frame.jpg' -OutFile $viewerFrame -TimeoutSec 2
                $viewerReady = $true
                break
              } catch { }
            }
            if (-not $viewerReady) { throw 'Read-only spectator cannot capture the synthetic game window.' }
            $jpeg = [System.IO.File]::ReadAllBytes($viewerFrame)
            if ($jpeg.Length -lt 16 -or $jpeg[0] -ne 255 -or $jpeg[1] -ne 216) { throw 'Viewer response is not a JPEG frame.' }
            Write-Host "Spectator served a real window-only JPEG frame ($($jpeg.Length) bytes)."
          }
          finally {
            if ($spectatorProc -and -not $spectatorProc.HasExited) { Stop-Process -Id $spectatorProc.Id -Force -ErrorAction SilentlyContinue }
            if (-not $fixtureProc.HasExited) { Stop-Process -Id $fixtureProc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Publish synthetic-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-synthetic-fixture-evidence
          path: lab/windows-playtest/out/fixture/
          if-no-files-found: ignore
          retention-days: 3

  public-executable-preflight:
    # One-time diagnostic for the repository's OWN Windows EXE without retail
    # game assets. This job must never claim successful gameplay.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[probe-windows]')
    needs: scenario-validation
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install window-only capture dependency
        run: python -m pip install "Pillow>=11.2,<12"
      - name: Identify original executable's imported DLL dependencies
        shell: pwsh
        run: |
          python -m pip install "pefile>=2024.8.26,<2027"
          python lab/windows-playtest/pe_import_probe.py OpenLRR.exe
      - name: Probe OpenLRR.exe in clean hosted Windows session
        shell: pwsh
        run: |
          python lab/windows-playtest/playtest.py --exe OpenLRR.exe --scenario lab/windows-playtest/game-smoke.json --title 'Rock Raiders|OpenLRR' --startup-timeout 15 --out lab/windows-playtest/out/assetless-preflight
          Write-Host "Original Windows executable diagnostic exit status: $LASTEXITCODE"
          if (Test-Path lab/windows-playtest/out/assetless-preflight/report.json) {
            Get-Content lab/windows-playtest/out/assetless-preflight/report.json
          }
          Write-Host "No original retail WAD or data files are available in public CI. Preflight cannot establish playability."
          exit 0
      - name: Preserve assetless launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-windows-executable-no-assets-diagnostic
          path: lab/windows-playtest/out/assetless-preflight/
          if-no-files-found: ignore
          retention-days: 3

  compile-original-openlrr-dll:
    # One-time check: can this branch build the actual Windows engine DLL?
    # No retail game assets, graphics DLLs, or Windows installation required.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build-openlrr]')
    needs: scenario-validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Compile x86 original OpenLRR game logic DLL
        shell: pwsh
        run: |
          msbuild openlrr.sln /t:openlrr /p:Configuration=Release /p:Platform=x86 /m
          if ($LASTEXITCODE -ne 0) { throw "OpenLRR.dll x86 build failed" }
          if (-not (Test-Path bin/openlrr.dll)) { throw "Expected original game logic DLL absent" }
          Write-Host "Successfully built in-repository x86 OpenLRR engine DLL"
      - name: Save compiled open-source engine DLL for private testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-original-openlrr-windows-engine-x86
          path: bin/openlrr.dll
          if-no-files-found: error
          retention-days: 3

  private-original-windows-game:
    if: github.event_name == 'workflow_dispatch' && inputs.run_private_game
    needs: scenario-validation
    runs-on: [self-hosted, Windows, X64, openlrr-gui]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install controller capture dependency
        run: python -m pip install "Pillow>=11.2,<12"
      - name: Run original game locally, keep evidence private
        shell: pwsh
        run: |
          $exe = $env:OPENLRR_GAME_EXE
          if (-not $exe -or -not (Test-Path -LiteralPath $exe)) { throw "Set OPENLRR_GAME_EXE on the private Windows runner to the local installed executable." }
          python lab/windows-playtest/playtest.py --exe "$exe" --scenario lab/windows-playtest/game-smoke.json --out "$env:LOCALAPPDATA/OpenLRR-Private-Reports/ci-smoke"
          if ($LASTEXITCODE -ne 0) { throw "Private game smoke failed: inspect the runner's LOCALAPPDATA report (never public artifacts)." }
