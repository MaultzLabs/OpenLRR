name: OpenLRR authorized native review 20261026-a
on:
  push:
    branches: [lab-native-model-textures-music-v1]
    paths: [.github/workflows/lab-native-review-once.yml]
permissions:
  contents: read
concurrency:
  group: openlrr-native-gameplay-review
  cancel-in-progress: false
jobs:
  review-once:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Run one authorized native review 20261026-a'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline reviewer checks
        run: python3 -m unittest discover -s lab/native-reviewer/tests -v
      - name: One user-authorized API review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENLRR_AI_LAB_KEY }}
        run: python3 lab/native-reviewer/review.py --authorize-one-paid-call
      - name: Save result for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenLRR-Native-Gameplay-Review-20261026-a
          path: native-review-output/
          if-no-files-found: warn
          retention-days: 14
