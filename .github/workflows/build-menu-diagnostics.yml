name: OpenLRR Menu Diagnostics Win32

on:
  push:
    branches: [lab-approved-worker-v1, lab-wine-isolation-audit-v1, lab-private-research-outbox-v1, lab-paired-research-ticket-v1, lab-research-handoff-v1, lab-supervisor-handoff-v1, lab-blit-cpu-probe-v1, menu-perf-build, automated-benchmark-harness, benchmark-loop-v2, agent-loop-v1, lab-render-diagnostics-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win32:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build 32-bit OpenLRR DLL
        shell: pwsh
        run: |
          msbuild openlrr.sln /t:openlrr /m /p:Configuration=Release /p:Platform=x86 /verbosity:minimal /bl:build.binlog
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }
      - name: Verify x86 DLL and package
        shell: pwsh
        run: |
          $dll = 'bin/openlrr.dll'
          if (-not (Test-Path $dll)) { throw "Missing expected binary: $dll" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $dll))
          $pe = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $arch = [System.BitConverter]::ToUInt16($bytes, $pe+4)
          if ($arch -ne 0x014c) { throw ("Expected x86 PE, got 0x{0:x4}" -f $arch) }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $dll dist/openlrr.dll
          Copy-Item BUILD-AND-TEST.md dist/
          Copy-Item scripts/macos/run-autobenchmark.sh dist/
          Copy-Item scripts/macos/publish-benchmark.sh dist/
          Copy-Item scripts/macos/analyze-benchmark.py dist/
          Copy-Item docs/autobenchmark.md dist/
          (Get-FileHash $dll -Algorithm SHA256).Hash | Set-Content dist/SHA256.txt
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: OpenLRR-menu-diagnostics-x86
          path: dist/
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenLRR-build-binlog
          path: build.binlog
          if-no-files-found: ignore

  telemetry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate benchmark analyzer with synthetic CSVs
        run: python -m unittest discover -s scripts/macos/tests -p 'test_*.py' -v
      - name: Check Mac shell script syntax
        run: bash -n scripts/macos/run-autobenchmark.sh scripts/macos/publish-benchmark.sh scripts/macos/diagnostic-one-shot.sh
