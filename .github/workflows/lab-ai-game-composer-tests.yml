name: OpenLRR AI Mission Composer Safety

on:
  push:
    branches: [lab-ai-game-composer-v1]
    paths:
      - 'scripts/composer/**'
      - '.github/workflows/lab-ai-game-composer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline tests — mock all model calls
        run: |
          python -m compileall -q scripts/composer
          python -m unittest discover -s scripts/composer/tests -p 'test_*.py' -v
      - name: Dry run cannot call model without opt-in
        run: |
          python scripts/composer/ai_mission_designer.py \
            --theme 'Recover energy crystals from an original underground cave' \
            --out /tmp/OpenLRR-Composer-DryRun
          test ! -e /tmp/OpenLRR-Composer-DryRun
