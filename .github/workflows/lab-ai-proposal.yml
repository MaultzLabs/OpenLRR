name: OpenLRR Native Gameplay Review (one call, opt-in)

on:
  workflow_dispatch:
    inputs:
      run_model:
        description: 'Authorize ONE billable API review; false only prepares the packet'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: openlrr-native-gameplay-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate reviewer without model calls
        run: python3 -m unittest discover -s lab/native-reviewer/tests -v
      - name: Prepare exact-commit public-source packet
        run: python3 lab/native-reviewer/review.py
      - name: Make one explicitly authorized API request
        if: inputs.run_model == true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENLRR_AI_LAB_KEY }}
        run: python3 lab/native-reviewer/review.py --authorize-one-paid-call
      - name: Preserve review for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenLRR-Native-Gameplay-Review
          path: native-review-output/
          if-no-files-found: warn
          retention-days: 14
