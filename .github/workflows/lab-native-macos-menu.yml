name: Native Rock Raiders menu prototype verification
on:
  push:
    branches: [lab-native-macos-menu-v1, lab-native-nerps-state-v1, lab-native-tutorial-controls-integrated-v2, lab-native-texture-audio-fix-v1, lab-native-original-raider-model-v1, lab-native-model-textures-music-v1]
    paths:
      - native/macos-menu/**
      - .github/workflows/lab-native-macos-menu.yml
  workflow_dispatch:
permissions:
  contents: read
# Keep the portable Swift tests moving even if an older optional macOS
# runner job is stuck queued. Only the newest push needs its parser results.
concurrency:
  group: native-rock-raiders-portable-v2-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  parser-tests:
    if: github.repository == 'MaultzLabs/OpenLRR'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify game formats and menu models with synthetic test data
        run: |
          swiftc --version
          bash native/macos-menu/test.sh
      - name: Verify bounded soundtrack import and conversion
        run: python3 -m unittest discover -s native/macos-menu/tools/tests -v
      - name: Verify gameplay capture never leaves the target game window
        run: |
          python3 -m unittest discover -s native/macos-menu/tools/gameplay-capture/tests -v
  compile-native-mac:
    # Public hosted Mac compiles are opt-in; parser-tests run on each push.
    # A separately launched job checks AppKit/ARM64 without requiring the user's Mac.
    if: github.event_name == 'push'
    needs: parser-tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile native ARM64 AppKit prototype
        # The parser-tests job already verifies every portable parser on Linux.
        # macOS should verify Apple's frameworks/compiler rather than
        # repeating the CPU-heavy portable fixture suite.
        run: |
          cd native/macos-menu
          bash build.sh
          mkdir -p tools/gameplay-capture/.build
          xcrun swiftc -O -framework Cocoa -framework CoreGraphics \
            tools/gameplay-capture/window_probe.swift \
            -o tools/gameplay-capture/.build/window_probe
          test -x tools/gameplay-capture/.build/window_probe
          test -f build/RockRaidersNativeMenu.app/Contents/MacOS/RockRaidersNativeMenu
          /usr/bin/lipo -archs build/RockRaidersNativeMenu.app/Contents/MacOS/RockRaidersNativeMenu | grep -qx 'arm64'
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            build/RockRaidersNativeMenu.app RockRaidersNativeMenu-arm64-prototype.zip
      - name: Upload source-only native prototype (never game assets)
        uses: actions/upload-artifact@v4
        with:
          name: rock-raiders-native-menu-arm64-prototype
          path: native/macos-menu/RockRaidersNativeMenu-arm64-prototype.zip
          if-no-files-found: error
          retention-days: 3
