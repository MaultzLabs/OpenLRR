name: OpenLRR Private Manifest Publishing Safety

on:
  push:
    branches: [lab-private-manifest-publisher-v1]
    paths:
      - 'scripts/agent/publish_experiment.py'
      - 'scripts/agent/tests/test_publish_experiment.py'
      - '.github/workflows/lab-private-manifest-publisher-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: All AI and private-publisher regression tests
        run: |
          python -m py_compile scripts/agent/publish_experiment.py
          python -m unittest discover -s scripts/agent/tests -p 'test_*.py' -v
