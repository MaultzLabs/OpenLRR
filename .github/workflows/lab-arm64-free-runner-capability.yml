name: OpenLRR free Apple Silicon capability probe
# One scoped no-cost public-repository probe. NO wine installs, no game files.
on:
  push:
    branches: [lab-arm64-free-runner-capability-v1]
    paths:
      - .github/workflows/lab-arm64-free-runner-capability.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openlrr-arm64-capability-one-shot
  cancel-in-progress: false

jobs:
  arm64-probe:
    if: github.repository == 'MaultzLabs/OpenLRR'
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - name: Read-only ARM64, Rosetta, Wine and Quartz capability check
        shell: bash
        env:
          OPENLRR_REPORT_PATH: ${{ runner.temp }}/openlrr-free-mac-capabilities.json
        run: |
          python3 - <<'PY'
          import json, os, platform, shutil, subprocess
          from pathlib import Path

          def check(command, timeout=10):
              try:
                  result = subprocess.run(
                      command, stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL, timeout=timeout, check=False)
                  return "yes" if result.returncode == 0 else "no"
              except (OSError, subprocess.TimeoutExpired):
                  return "unavailable"

          is_mac = platform.system() == "Darwin"
          arch = platform.machine()
          swift = shutil.which("swift")
          wine = shutil.which("wine") or shutil.which("wine64")
          swift_quartz = """import CoreGraphics
          import Darwin
          var count: UInt32 = 0
          let status = CGGetActiveDisplayList(0, nil, &count)
          if status == .success && count > 0 { exit(0) }
          exit(4)
          """
          report = {
              "schema": "openlrr-free-macos-arm64-v1",
              "run_type": "read_only_capability_probe",
              "apple_silicon": is_mac and arch == "arm64",
              "macos_26": is_mac and platform.mac_ver()[0].startswith("26."),
              "rosetta_x86_64_process": (
                  check(["/usr/bin/arch", "-x86_64", "/usr/bin/true"])
                  if is_mac and arch == "arm64" else "not_applicable"
              ),
              "quartz_active_display": (
                  check([swift, "-e", swift_quartz], 60)
                  if is_mac and swift else "unavailable"
              ),
              "wine_executable": (
                  check([wine, "--version"]) if wine else "not_installed"
              ),
              "wine_wineskin_installed_by_probe": False,
              "game_assets_present": False,
              "wine_32bit_directdraw_verified": False,
              "visible_fps_verified": False,
              "working_game_touched": False,
              "paid_api_calls": False,
              "paid_runner_requested": False,
          }
          target = Path(os.environ["OPENLRR_REPORT_PATH"])
          target.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Archive sanitized capabilities only
        uses: actions/upload-artifact@v4
        with:
          name: openlrr-free-macos-arm64-capabilities
          path: ${{ runner.temp }}/openlrr-free-mac-capabilities.json
          if-no-files-found: error
          retention-days: 1
