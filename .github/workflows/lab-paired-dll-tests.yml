name: OpenLRR Distinct-DLL A/B Safety Tests

on:
  push:
    branches: [lab-paired-dll-trials-v1]
    paths:
      - 'scripts/macos/paired-dll-eval.py'
      - 'scripts/macos/prepare-approved-baseline.py'
      - 'scripts/macos/candidate-inbox.py'
      - 'scripts/macos/tests/test_paired_dll_eval.py'
      - 'scripts/macos/tests/test_prepare_approved_baseline.py'
      - '.github/workflows/lab-paired-dll-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python and run end-to-end synthetic safety tests
        run: |
          python -m py_compile scripts/macos/paired-dll-eval.py scripts/macos/prepare-approved-baseline.py
          python -m unittest discover -s scripts/macos/tests -p 'test_paired_dll_eval.py' -v
          python -m unittest discover -s scripts/macos/tests -p 'test_prepare_approved_baseline.py' -v
          python -m unittest discover -s scripts/macos/tests -p 'test_candidate_inbox.py' -v
          python -m unittest discover -s scripts/agent/tests -p 'test_*.py' -q
