name: OpenLRR Menu Session Package Offline Proof

on:
  push:
    branches: [lab-menu-session-package-v1]
    paths:
      - 'scripts/macos/menu-diagnostic-session.py'
      - 'scripts/macos/diagnostic-one-shot.sh'
      - 'scripts/macos/tests/test_menu_diagnostic_session.py'
      - '.github/workflows/lab-menu-session-package.yml'
      - 'docs/MENU-SESSION-PACKAGE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-mac-safety-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile diagnostics Python, run no-Wine fixture tests
        run: |
          python3 -m compileall -q scripts/macos/menu-diagnostic-session.py
          python3 -m unittest discover -s scripts/macos/tests -p 'test_menu_diagnostic_session.py' -v
      - name: Validate one-shot shell syntax and exactly bounded plans
        run: |
          bash -n scripts/macos/diagnostic-one-shot.sh
          python3 - <<'PY'
          from pathlib import Path
          source=Path('scripts/macos/diagnostic-one-shot.sh').read_text()
          assert 'OPENLRR_DIAGNOSTIC_REVIEWED_SHA256' in source
          assert 'baseline,baseline|baseline,nowait,baseline,nowait|baseline,gdi,baseline,gdi' in source
          assert 'Unknown graphics mode' not in source
          assert '"$supervisor" --approved-sha "$actual" --plan "$plan" --seconds 60 --run' in source
          print('Approved-only graphics plans and reviewed SHA guard present')
          PY
      - name: Baseline analyzer and supervisor existing regressions
        run: |
          python3 -m unittest discover -s scripts/macos/tests -p 'test_analyze_benchmark.py' -v
          python3 -m unittest discover -s scripts/macos/tests -p 'test_lab_supervisor.py' -v

  existing-visual-qa-regressions:
    # Validate visual branch independently WITHOUT merging or invoking captures.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 40c5f92d66b7e19ea4b11691b77ceb6ca063eff8
          path: visual-qa-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-only fixture test dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6' 'Pillow==11.3.0'
      - name: Run existing visual regression and TEST capture safety checks
        working-directory: visual-qa-review
        run: |
          python -m unittest discover -s scripts/visual_qa/tests -p 'test_*.py' -v
          python -m unittest discover -s scripts/macos/tests -p 'test_capture_test_window.py' -v
          python -m unittest discover -s scripts/macos/tests -p 'test_visual_timeline.py' -v
      - name: Verify visual tests did not use a real app
        working-directory: visual-qa-review
        run: |
          git diff --exit-code
          echo 'Visual QA fixture tests passed; live screen capture and visible FPS remain unverified.'
